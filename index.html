<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datepicker UI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="datepicker">
        <div class="main-grid">
            <div class="input-date">
                <input class="select-date-input" type="text" name="date" placeholder="DD/MM/YYYY" id="date">
            </div>
            <div class="input-icon">
                <button class="select-date-button flex-center">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="select-date-icon">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
                    </svg>
                </button>
            </div>
            <div class="arrow-previous-month flex-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="previous-month-icon">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                </svg>
            </div>
            <div class="selected-month-and-year flex-center">
                <p>Sierpień 2026</p>
            </div>
            <div class="arrow-next-month flex-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="next-month-icon">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                </svg>
            </div>

            <div class="day-of-a-week flex-center">
                <p>Poniedziałek</p>
            </div>
            <div class="day-of-a-week flex-center">
                <p>Wtorek</p>
            </div>
            <div class="day-of-a-week flex-center">
                <p>Środa</p>
            </div>
            <div class="day-of-a-week flex-center">
                <p>Czwartek</p>
            </div>
            <div class="day-of-a-week flex-center">
                <p>Piątek</p>
            </div>
            <div class="day-of-a-week flex-center">
                <p>Sobota</p>
            </div>
            <div class="day-of-a-week flex-center">
                <p>Niedziela</p>
            </div>
            <button class="saturday flex-center" type="button">1</button>
            <button class="sunday flex-center" type="button">2</button>
            <button class="weekday flex-center" type="button">3</button>
            <button class="weekday flex-center" type="button">4</button>
            <button class="weekday flex-center" type="button">5</button>
            <button class="weekday flex-center" type="button">6</button>
            <button class="weekday flex-center" type="button">7</button>
            <button class="saturday flex-center" type="button">8</button>
            <button class="sunday flex-center" type="button">9</button>
            <button class="weekday flex-center" type="button">10</button>
            <button class="weekday flex-center" type="button">11</button>
            <button class="weekday flex-center" type="button">12</button>
            <button class="weekday flex-center" type="button">13</button>
            <button class="weekday flex-center" type="button">14</button>
            <button class="saturday flex-center" type="button">15</button>
            <button class="sunday flex-center" type="button">16</button>
            <button class="weekday flex-center" type="button">17</button>
            <button class="weekday flex-center" type="button">18</button>
            <button class="weekday flex-center" type="button">19</button>
            <button class="weekday flex-center" type="button">20</button>
            <button class="weekday flex-center" type="button">21</button>
            <button class="saturday flex-center" type="button">22</button>
            <button class="sunday flex-center" type="button">23</button>
            <button class="weekday flex-center" type="button">24</button>
            <button class="weekday flex-center" type="button">25</button>
            <button class="weekday flex-center" type="button">26</button>
            <button class="weekday flex-center" type="button">27</button>
            <button class="weekday flex-center" type="button">28</button>
            <button class="saturday flex-center" type="button">29</button>
            <button class="sunday flex-center" type="button">30</button>
            <button class="weekday flex-center" type="button">31</button>
        </div>
    </div>
</body>

</html>
